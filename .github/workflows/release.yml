name: release

# Every push to main updates one release PR, written by release-please from the
# Conventional Commits since the last tag. Merging that PR tags the release,
# and the goreleaser job then builds the binaries and updates the Homebrew cask.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # GitHub won't let the default token open PRs on a push run, and PRs it
          # opens wouldn't trigger CI. A fine-grained PAT with Contents and Pull
          # requests read and write, stored as RELEASE_PLEASE_TOKEN, does both.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    # Waits for a reviewer to approve before the job gets HOMEBREW_TAP_TOKEN.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Only these hosts are reachable, so a compromised tool can't send the
      # tokens anywhere else. A blocked call fails the job and shows up on the
      # run's StepSecurity insights page; add the host here and re-run.
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            go.dev:443
            dl.google.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            tmaproduction.blob.core.windows.net:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Release builds start clean, and skipping the cache keeps the Actions
          # cache service off the allowlist.
          cache: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A fine-grained PAT with Contents read and write on vuon9/tap.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # Signs a build provenance attestation for every archive in checksums.txt,
      # so `gh attestation verify` can prove a download was built here.
      - name: Check archives against checksums.txt
        working-directory: dist
        run: sha256sum -c checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      # Verify the files users download from the release, not the local build.
      - name: Verify provenance of the release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verify
          while read -r _ f; do
            gh release download "$TAG" --pattern "$f" --dir verify --clobber
            # A new attestation can take a moment to become visible.
            for attempt in 1 2 3 4 5; do
              gh attestation verify "verify/$f" --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" && break
              [ "$attempt" -lt 5 ] || exit 1
              sleep 10
            done
          done < dist/checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
