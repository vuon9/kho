name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a new advisory against a dependency shows up without a push.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: ci changes
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      docs: ${{ steps.filter.outputs.docs }}
      workflows: ${{ steps.filter.outputs.workflows }}
      release: ${{ steps.filter.outputs.release }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
            docs:
              - 'AGENTS.md'
              - 'skills/use-kho/SKILL.md'
            workflows:
              - '.github/workflows/**'
            release:
              - '.goreleaser.yaml'

  test:
    needs: changes
    if: always()
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        if: needs.changes.result != 'success' || needs.changes.outputs.go == 'true' || needs.changes.outputs.docs == 'true'
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.result != 'success' || needs.changes.outputs.go == 'true' || needs.changes.outputs.docs == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.result != 'success' || needs.changes.outputs.go == 'true' || needs.changes.outputs.docs == 'true'
        with:
          go-version-file: go.mod
      - name: test
        if: needs.changes.result != 'success' || needs.changes.outputs.go == 'true' || needs.changes.outputs.docs == 'true'
        run: |
          test -z "$(gofmt -l . | tee /dev/stderr)"
          go vet ./...
          go test -race ./...
          go build ./...

  govulncheck:
    needs: changes
    if: >-
      always() && (
        needs.changes.result != 'success' ||
        needs.changes.outputs.go == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          repo-checkout: false

  fuzz:
    needs: changes
    if: >-
      always() && (
        needs.changes.result != 'success' ||
        needs.changes.outputs.go == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -run '^$' -fuzz=FuzzParsers -fuzztime=30s ./internal/provider

  goreleaser-check:
    needs: changes
    if: >-
      always() && (
        needs.changes.result != 'success' ||
        needs.changes.outputs.release == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.0
          args: check

  actionlint:
    needs: changes
    if: >-
      always() && (
        needs.changes.result != 'success' ||
        needs.changes.outputs.workflows == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # go run checks the module against sum.golang.org, so the pinned version
      # is the code that runs.
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
