name: ai-code-review

# The review itself lives in vuon9/gh-workflows.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:

concurrency:
  group: ai-code-review-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  review-pr:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && !startsWith(github.event.pull_request.head.ref, 'release-please--')
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: vuon9/gh-workflows/.github/workflows/ai-code-review.yml@22c7285151d8084c3bc40dd69998bb194c0f0db3 # v0.4.7
    with:
      mode: pr
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  on-demand:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: vuon9/gh-workflows/.github/workflows/ai-code-review.yml@22c7285151d8084c3bc40dd69998bb194c0f0db3 # v0.4.7
    with:
      mode: comment
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

